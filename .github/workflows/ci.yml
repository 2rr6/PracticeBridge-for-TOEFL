name: Synthetic verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-js:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.16.0', '22.22.3']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/verify.mjs --profile pure-js
  source-audit:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
      - run: npm ci
      - run: npm install --prefix .cache/sbom --ignore-scripts --no-save npm@12.0.1
      - name: Download pinned development scanners
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/tools | Out-Null
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile .cache/tools/gitleaks.zip
          if ((Get-FileHash .cache/tools/gitleaks.zip).Hash.ToLower() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive .cache/tools/gitleaks.zip .cache/tools/gitleaks-expanded
          Copy-Item .cache/tools/gitleaks-expanded/gitleaks.exe .cache/tools/gitleaks-8.30.1.exe
          Invoke-WebRequest 'https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_windows_amd64.exe' -OutFile .cache/tools/osv-scanner-2.5.1.exe
          if ((Get-FileHash .cache/tools/osv-scanner-2.5.1.exe).Hash.ToLower() -ne '25e42f5ef6711fd8c0fb45390972205891dd44c6bd02ac93f0f63e8e98d9bfb6') { throw 'OSV checksum mismatch' }
      - run: node scripts/release-source.mjs
      - name: Audit actual source archive and its dependency SBOM
        shell: pwsh
        run: |
          $env:PRACTICEBRIDGE_NPM_CLI = Join-Path $pwd '.cache/sbom/node_modules/npm/bin/npm-cli.js'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/security-release.mjs --source "dist/PracticeBridge-$version-source.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows-electron:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
      - run: npm ci
      - name: Cache official Electron archive for local packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/electron | Out-Null
          Invoke-WebRequest 'https://github.com/electron/electron/releases/download/v44.3.0/electron-v44.3.0-win32-x64.zip' -OutFile .cache/electron/electron-v44.3.0-win32-x64.zip
          if ((Get-FileHash .cache/electron/electron-v44.3.0-win32-x64.zip).Hash.ToLower() -ne '26bf9a617d58d81772b3d68305d59ee48272969c15083c06db634a77358a8d9d') { throw 'Electron checksum mismatch' }
      - run: node scripts/package.mjs --out dist/ci
      - run: node scripts/verify.mjs --profile windows-smoke --packaged dist/ci/PracticeBridge-win32-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: synthetic-verification-summary
          path: test-results/verification-*/result.json
          if-no-files-found: error
# No publish, deployment, release write permission, secret reference or pull_request_target.
